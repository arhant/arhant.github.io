name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Google Analytics measurement ID
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA_MEASUREMENT_ID" ]; then
            echo "::warning::GA_MEASUREMENT_ID secret is not set; the site will deploy without analytics."
            exit 0
          fi
          if ! printf '%s' "$GA_MEASUREMENT_ID" | grep -Eq '^G-[A-Z0-9]+$'; then
            echo "::error::GA_MEASUREMENT_ID must look like G-XXXXXXXXXX."
            exit 1
          fi
          sed -i "s/__GA_MEASUREMENT_ID__/${GA_MEASUREMENT_ID}/g" index.html
          grep -q "$GA_MEASUREMENT_ID" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
