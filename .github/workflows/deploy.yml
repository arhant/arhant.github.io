name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The blocking checks from ci.yml (links and #anchors, axe-core). ci.yml has no push trigger,
  # so this call is the only time they run for a push. Its Lighthouse job is warn-only and
  # never fails this gate.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Google Analytics measurement ID
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA_MEASUREMENT_ID" ]; then
            echo "::warning::GA_MEASUREMENT_ID secret is not set; the site will deploy without analytics."
            exit 0
          fi
          if ! printf '%s' "$GA_MEASUREMENT_ID" | grep -Eq '^G-[A-Z0-9]+$'; then
            echo "::error::GA_MEASUREMENT_ID must look like G-XXXXXXXXXX."
            exit 1
          fi
          # Every page that carries the GA snippet: the homepage, the case studies and /black-hole/
          pages=(index.html work/*/index.html black-hole/index.html)
          sed -i "s/__GA_MEASUREMENT_ID__/${GA_MEASUREMENT_ID}/g" "${pages[@]}"
          for f in "${pages[@]}"; do grep -q "$GA_MEASUREMENT_ID" "$f"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
