<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost in space | Arhant Jain</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07071a">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .lost { min-height: 100svh; display: grid; place-items: center; padding: 24px var(--gutter); }
        .lost .panel { max-width: 600px; text-align: center; padding: clamp(32px, 6vw, 56px); }
        .lost h1 { margin-top: 10px; font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: -0.03em; }
        .lost p.lead { margin: 14px auto 28px; max-width: 42ch; color: var(--text-2); font-size: 1.05rem; }
        .lost .code {
            display: block;
            margin-bottom: 4px;
            font: 700 clamp(4rem, 16vw, 7rem)/1 var(--mono);
            letter-spacing: -0.04em;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .lost .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <div class="backdrop-band"></div>
        <div class="backdrop-stars backdrop-stars--near"></div>
        <div class="backdrop-stars backdrop-stars--far"></div>
    </div>
    <main class="lost">
        <div class="panel">
            <span class="code" aria-hidden="true">404</span>
            <p class="mono-label"><span class="sec-num">ERR</span> // Signal lost</p>
            <h1>Lost in space</h1>
            <p class="lead">This page drifted out of range. Head back to launch, or plot a course to one of the sections below.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></g></svg>
                    Return to launch
                </a>
                <a class="btn btn-ghost" href="/#projects">Case studies</a>
                <a class="btn btn-ghost" href="/#contact">Contact</a>
            </div>
        </div>
    </main>
</body>
</html>
